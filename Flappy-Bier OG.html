    firemoon: { a:'#6a463b', b:'#33201b', c:'#150b09', kind:'basalt' },
    sea:      { a:'#5fe0bd', b:'#1f9088', c:'#0b4752', kind:'coral' },
    space:    { a:'#d3d9ec', b:'#8089a8', c:'#363c5a', kind:'metal' },
    moon:     { a:'#c4c4cc', b:'#8a8a94', c:'#4a4a55', kind:'rock' },
    neptune:  { a:'#b4dcff', b:'#4f8ae6', c:'#1b3f94', kind:'crystal' },
    jungle:   { a:'#9a7646', b:'#5d4328', c:'#2a1c10', kind:'trunk' },
  };

  function drawPipe(p, lvl){
    const st = PIPE_STYLES[lvl.scene] || PIPE_STYLES.sky;
    const groundY = H - 46;
    const pg = p.gap || pipeGap;
    const gapTop = p.gapY - pg/2, gapBot = p.gapY + pg/2;
    const seed = (p.seed !== undefined) ? p.seed : p.gapY;
    drawPipeSeg(p.x, p.w, 0, gapTop, true, st, seed);
    drawPipeSeg(p.x, p.w, gapBot, groundY, false, st, seed + 101);
  }

  function drawPipeSeg(x, w, y0, y1, isTop, st, seed){
    const len = y1 - y0;
    if (len < 2) return;
    const capH = Math.min(26, len), capX = x - 5, capW = w + 10;
    const by0 = isTop ? y0 : y0 + capH - 2;
    const by1 = isTop ? y1 - capH + 2 : y1;
    const bh = by1 - by0;
    const kind = st.kind;

    // Koerper
    if (bh > 0){
      ctx.fillStyle = st.b; ctx.fillRect(x, by0, w, bh);
      ctx.save();
      ctx.beginPath(); ctx.rect(x, by0, w, bh); ctx.clip();
      if (kind === 'ice' || kind === 'crystal'){
        for (let i = 0; i < 7; i++){
          const fx = x + hash(seed+i)*w, fy = by0 + hash(seed+i*2.1)*bh;
          ctx.fillStyle = 'rgba(255,255,255,' + (0.1 + hash(seed+i*5)*0.14).toFixed(2) + ')';
          ctx.beginPath(); ctx.moveTo(fx, fy-30); ctx.lineTo(fx+20, fy+14); ctx.lineTo(fx-18, fy+22); ctx.closePath(); ctx.fill();
        }
      } else if (kind === 'basalt'){
        const n = Math.max(1, Math.floor(bh/110) + 1);
        for (let c = 0; c < n; c++){
          let cx = x + 8 + hash(seed+c*3)*(w-16), cy = by0 + hash(seed+c)*50;
          const pts = [[cx, cy]];
          while (cy < by1){ cy += 26; cx += (hash(seed+cy*0.1+c)-0.5)*16; cx = Math.max(x+4, Math.min(x+w-4, cx)); pts.push([cx, cy]); }
          const pulse = 0.5 + 0.5*Math.sin(frame*0.06 + c*2 + seed);
          for (const pass of [0, 1]){
            ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
            for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
            ctx.strokeStyle = pass ? 'rgba(255,190,70,0.95)' : 'rgba(255,100,20,' + (0.25 + 0.25*pulse).toFixed(2) + ')';
            ctx.lineWidth = pass ? 1.4 : 5; ctx.stroke();
          }
        }
      } else if (kind === 'coral'){
        const n = Math.min(40, Math.floor(bh/9));
        for (let i = 0; i < n; i++){
          ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.14)' : 'rgba(0,40,50,0.25)';
          ctx.beginPath(); ctx.arc(x + hash(seed+i*1.3)*w, by0 + hash(seed+i*2.7)*bh, 1.5 + hash(seed+i)*2.5, 0, TAU); ctx.fill();
        }
      } else if (kind === 'metal'){
        for (let yy = by0 + 22; yy < by1; yy += 44){
          ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x, yy, w, 2);
          ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(x, yy+2, w, 1.2);
          ctx.fillStyle = 'rgba(255,255,255,0.5)';
          ctx.beginPath(); ctx.arc(x+7, yy+9, 1.7, 0, TAU); ctx.arc(x+w-7, yy+9, 1.7, 0, TAU); ctx.fill();
        }
      } else if (kind === 'rock'){
        for (let yy = by0 + 14; yy < by1; yy += 26){
          ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.moveTo(x, yy + hash(seed+yy)*6); ctx.lineTo(x+w, yy + hash(seed+yy*2)*6); ctx.stroke();
        }
        for (let i = 0; i < 5; i++){
          ctx.fillStyle = 'rgba(0,0,0,0.16)';
          ctx.beginPath(); ctx.ellipse(x + hash(seed+i)*w, by0 + hash(seed+i*3)*bh, 4+hash(seed+i*7)*6, 3+hash(seed+i*9)*3, 0, 0, TAU); ctx.fill();
        }
      } else if (kind === 'trunk'){
        for (let i = 0; i < 5; i++){
          const lx = x + (i + 0.5)*w/5;
          ctx.strokeStyle = 'rgba(20,10,0,0.38)'; ctx.lineWidth = 2;
          ctx.beginPath();
          for (let yy = by0; yy <= by1; yy += 14){
            const px = lx + Math.sin(yy*0.07 + i*2 + seed)*3;
            if (yy === by0) ctx.moveTo(px, yy); else ctx.lineTo(px, yy);
          }
          ctx.stroke();
        }
        ctx.strokeStyle = '#2f8f3a'; ctx.lineWidth = 2.6;
        ctx.beginPath();
        for (let yy = by0; yy <= by1; yy += 12){
          const px = x + w*0.72 + Math.sin(yy*0.05 + seed)*6;
          if (yy === by0) ctx.moveTo(px, yy); else ctx.lineTo(px, yy);
        }
        ctx.stroke();
        ctx.fillStyle = '#3fae4a';
        for (let yy = by0 + 20; yy < by1; yy += 38){
          const px = x + w*0.72 + Math.sin(yy*0.05 + seed)*6;
          ctx.beginPath(); ctx.ellipse(px + 6, yy, 6, 3, 0.5, 0, TAU); ctx.fill();
          ctx.beginPath(); ctx.ellipse(px - 6, yy + 6, 6, 3, -0.5, 0, TAU); ctx.fill();
        }
      } else {
        for (let yy = by0 + 50; yy < by1; yy += 60){ ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.fillRect(x, yy, w, 2); }
      }
      // Zylinder-Beleuchtung
      const lg = ctx.createLinearGradient(x, 0, x + w, 0);
      lg.addColorStop(0, 'rgba(0,0,0,0.38)'); lg.addColorStop(0.16, 'rgba(255,255,255,0.20)');
      lg.addColorStop(0.42, 'rgba(255,255,255,0)'); lg.addColorStop(0.78, 'rgba(0,0,0,0.12)'); lg.addColorStop(1, 'rgba(0,0,0,0.5)');
      ctx.fillStyle = lg; ctx.fillRect(x, by0, w, bh);
      ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(x + w*0.2, by0, 3, bh);
      ctx.restore();
    }

    // Kappe
    const capY = isTop ? y1 - capH : y0;
    if (kind === 'ice' || kind === 'crystal'){
      const edge = isTop ? y1 : y0, dir = isTop ? -1 : 1;
      const far = edge + dir*capH, notch = edge + dir*6, n = 8;
      ctx.beginPath();
      ctx.moveTo(capX, far); ctx.lineTo(capX+capW, far); ctx.lineTo(capX+capW, notch);
      for (let i = n - 1; i >= 0; i--) ctx.lineTo(capX + capW*i/n, (i % 2 === 1) ? edge + dir*hash(seed+i)*2.5 : notch);
      ctx.closePath();
      ctx.fillStyle = st.a; ctx.fill();
      ctx.fillStyle = vgrad(Math.min(far, edge), Math.max(far, edge), [[0,'rgba(255,255,255,0.25)'],[1,'rgba(30,70,140,0.35)']]); ctx.fill();
      ctx.strokeStyle = st.c; ctx.lineWidth = 1.6; ctx.stroke();
    } else if (kind === 'trunk'){
      rr(capX + 2, capY, capW - 4, capH, 6);
      ctx.fillStyle = st.b; ctx.fill();
      ctx.strokeStyle = st.c; ctx.lineWidth = 2; ctx.stroke();
      for (let j = 0; j < 6; j++){
        const r = 8 + hash(seed+j*3)*6;
        const cx = capX + capW*(j + 0.5)/6;
        const cy = isTop ? y1 - r : y0 + r;
        ctx.fillStyle = j % 2 ? '#2f8f3a' : '#3fae4a';
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.14)';
        ctx.beginPath(); ctx.arc(cx - r*0.25, cy - r*0.3, r*0.5, 0, TAU); ctx.fill();
      }
    } else {
      rr(capX, capY, capW, capH, kind === 'pipe' ? 7 : 5);
      ctx.fillStyle = st.b; ctx.fill();
      ctx.save(); ctx.clip();
      const cg = ctx.createLinearGradient(capX, 0, capX + capW, 0);
      cg.addColorStop(0, 'rgba(0,0,0,0.4)'); cg.addColorStop(0.15, 'rgba(255,255,255,0.28)');
      cg.addColorStop(0.45, 'rgba(255,255,255,0)'); cg.addColorStop(0.8, 'rgba(0,0,0,0.14)'); cg.addColorStop(1, 'rgba(0,0,0,0.5)');
      ctx.fillStyle = cg; ctx.fillRect(capX, capY, capW, capH);
      if (kind === 'basalt'){
        const eg = isTop ? vgrad(y1 - 10, y1, [[0,'rgba(255,120,30,0)'],[1,'rgba(255,140,40,0.85)']]) : vgrad(y0, y0 + 10, [[0,'rgba(255,140,40,0.85)'],[1,'rgba(255,120,30,0)']]);
        ctx.fillStyle = eg; ctx.fillRect(capX, capY, capW, capH);
      } else if (kind === 'metal'){
        const on = (Math.floor(frame/24) + Math.floor(seed)) % 2 === 0;
        ctx.fillStyle = on ? '#5ee7ff' : '#ff5f6d';
        ctx.beginPath(); ctx.arc(capX + 9, capY + capH/2, 2.6, 0, TAU); ctx.arc(capX + capW - 9, capY + capH/2, 2.6, 0, TAU); ctx.fill();
      } else if (kind === 'coral'){
        for (let i = 0; i < 6; i++){
          ctx.fillStyle = 'rgba(255,255,255,0.18)';
          ctx.beginPath(); ctx.arc(capX + 6 + hash(seed+i)*(capW-12), capY + 4 + hash(seed+i*2)*(capH-8), 2.2, 0, TAU); ctx.fill();
        }
      }
      ctx.restore();
      rr(capX, capY, capW, capH, kind === 'pipe' ? 7 : 5);
      ctx.strokeStyle = st.c; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(capX + 5, isTop ? capY + 3 : capY + capH - 4, capW - 10, 1.6);
    }
    // weicher Schatten unter der Kappe
    const sy = isTop ? y1 - capH - 8 : y0 + capH;
    ctx.fillStyle = vgrad(isTop ? sy + 8 : sy, isTop ? sy : sy + 8, [[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,0.0)']]);
  }

  function drawSpeedLines(){
    ctx.save();
    ctx.lineCap = 'round';
    for (let i = 0; i < 18; i++){
      const laneY = (i*37 + (frame*7) % 37) % (H-50) + 4;
      const len = 60 + (i%4)*34;
      const x = W - ((frame*30 + i*109) % (W+260)) + 60;
      const g = ctx.createLinearGradient(x, 0, x + len, 0);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,0.65)');
      ctx.strokeStyle = g; ctx.lineWidth = 2 + (i%3);
      ctx.beginPath(); ctx.moveTo(x, laneY); ctx.lineTo(x + len, laneY); ctx.stroke();
    }
    const eg = ctx.createLinearGradient(0, 0, W, 0);
    eg.addColorStop(0, 'rgba(255,170,60,0.22)'); eg.addColorStop(0.25, 'rgba(255,170,60,0)');
    eg.addColorStop(0.75, 'rgba(120,200,255,0)'); eg.addColorStop(1, 'rgba(120,200,255,0.18)');
    ctx.fillStyle = eg; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // ----- UI-Bausteine -----
  const SCENE_COLORS = { sky:'#6cd0ff', ice:'#bfe9ff', lava:'#ff7a2a', sea:'#35c8d8', space:'#a58bff', moon:'#c9c9d6', neptune:'#5aa0ff', firemoon:'#ff5a3a', jungle:'#6fdc6f' };

  function txt(str, x, y, size, color, align, opts){
    opts = opts || {};
    ctx.font = (opts.weight || '800') + ' ' + size + 'px ' + FONT;
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.lineJoin = 'round';
    if (opts.shadow !== false){ ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillText(str, x + 1.5, y + 2.2); }
    if (opts.stroke){ ctx.lineWidth = opts.strokeW || 4; ctx.strokeStyle = opts.stroke; ctx.strokeText(str, x, y); }
    ctx.fillStyle = color || '#fff';
    ctx.fillText(str, x, y);
  }
  function chip(str, x, y, align, color, dot){
    ctx.font = '800 13px ' + FONT;
    const tw = ctx.measureText(str).width;
    const w = tw + 28 + (dot ? 14 : 0), h = 28;
    const x0 = align === 'right' ? x - w : (align === 'center' ? x - w/2 : x);
    ctx.fillStyle = 'rgba(8,12,28,0.58)'; rr(x0, y, w, h, 14); ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.stroke();
    let tx = x0 + 14;
    if (dot){ ctx.fillStyle = dot; ctx.beginPath(); ctx.arc(x0 + 16, y + h/2, 4.5, 0, TAU); ctx.fill(); tx += 14; }
    ctx.fillStyle = color || '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.font = '800 13px ' + FONT;
    ctx.fillText(str, tx, y + 19);
    return w;
  }
  function panel(x, y, w, h){
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(x + 4, y + 9, w, h, 22); ctx.fill();
    ctx.fillStyle = vgrad(y, y + h, [[0,'rgba(36,46,88,0.97)'],[1,'rgba(14,18,40,0.97)']]); rr(x, y, w, h, 22); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.stroke();
    ctx.fillStyle = vgrad(y, y + h*0.35, [[0,'rgba(255,255,255,0.10)'],[1,'rgba(255,255,255,0)']]); rr(x + 2, y + 2, w - 4, h*0.35, 20); ctx.fill();
  }
  function drawButton(rect, label, enabled, accent){
    if (enabled === undefined) enabled = true;
    accent = accent || '#ffb627';
    const hov = enabled && hitRect(rect, hoverX, hoverY);
    if (hov) anyHover = true;
    const x = rect.x, w = rect.w, h = rect.h, y = rect.y + (hov ? -2 : 0), rad = h / 2.4;
    ctx.fillStyle = 'rgba(0,0,0,0.38)'; rr(x, y + 5, w, h, rad); ctx.fill();
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    if (enabled){
      g.addColorStop(0, hov ? 'rgba(78,96,142,0.98)' : 'rgba(50,63,102,0.96)');
      g.addColorStop(1, hov ? 'rgba(34,42,76,0.98)' : 'rgba(22,28,54,0.96)');
    } else {
      g.addColorStop(0, 'rgba(40,46,66,0.7)'); g.addColorStop(1, 'rgba(24,28,44,0.7)');
    }
    ctx.fillStyle = g; rr(x, y, w, h, rad); ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = enabled ? (hov ? accent : 'rgba(255,255,255,0.24)') : 'rgba(255,255,255,0.1)';
    ctx.stroke();
    ctx.fillStyle = vgrad(y, y + h*0.5, [[0,'rgba(255,255,255,0.18)'],[1,'rgba(255,255,255,0)']]);
    rr(x + 2, y + 2, w - 4, h*0.46, rad); ctx.fill();
    const dot = enabled && w > 110;
    if (dot){ ctx.fillStyle = accent; ctx.beginPath(); ctx.arc(x + h*0.5, y + h/2, Math.max(3, h*0.1), 0, TAU); ctx.fill(); }
    txt(label, x + w/2 + (dot ? h*0.12 : 0), y + h/2 + h*0.14, Math.round(h*0.38), enabled ? '#ffffff' : 'rgba(255,255,255,0.45)', 'center');
  }
  function starPath(cx, cy, R, r){
    ctx.beginPath();
    for (let i = 0; i < 10; i++){
      const a = -Math.PI/2 + i*Math.PI/5, rad = i % 2 === 0 ? R : r;
      const px = cx + Math.cos(a)*rad, py = cy + Math.sin(a)*rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }
  function drawVignette(){
    if (!vigGrad){
      vigGrad = ctx.createRadialGradient(W/2, H/2, H*0.38, W/2, H/2, H*1.0);
      vigGrad.addColorStop(0, 'rgba(0,0,0,0)'); vigGrad.addColorStop(1, 'rgba(0,0,0,0.42)');
    }
    ctx.fillStyle = vigGrad; ctx.fillRect(0, 0, W, H);
  }
  function drawNightBG(){
    ctx.fillStyle = vgrad(0, H, [[0,'#0a1024'],[1,'#1d2a52']]); ctx.fillRect(0, 0, W, H);
    glow(W*0.5, -40, 520, [90,120,255], 0.18);
    for (let i = 0; i < 70; i++){
      const x = ((hash(i*1.9)*W - bgScroll*(0.04 + hash(i)*0.1)) % W + W) % W, y = hash(i*4.1)*H;
      const a = 0.25 + 0.5*Math.abs(Math.sin(frame*0.02 + i));
      ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')'; ctx.fillRect(x, y, 1.6, 1.6);
    }
  }
  function menuClouds(){
    for (let i = 0; i < 5; i++){
      const sp = 0.25 + i*0.08, span = W + 360;
      const x = ((i*230 - bgScroll*sp) % span + span) % span - 180;
      puffCloud(x, 46 + ((i*53) % 100), 40 + (i%3)*12, 0.92);
    }
  }
  function drawPlayfield(lvl, rot, flap){
    drawBackground(lvl);
    for (const p of pipes) drawPipe(p, lvl);
    if (jetpackItem) drawJetpackItem(jetpackItem.x, jetpackItem.y + Math.sin(frame*0.12)*5);
    drawGround(lvl);
    if (boostActive) drawSpeedLines();
    drawBird(bird.x, bird.y, rot, 1, flap, transformed, boostActive);
  }

  // ----- HUD -----
  function drawHUD(lvl){
    const rank = rankFor(totalScore);
    txt(String(score), W/2, 70, 60, '#ffffff', 'center', { stroke:'rgba(12,18,40,0.9)', strokeW:8 });
    chip(lvl.name.toUpperCase(), W/2, 82, 'center', '#ffffff', SCENE_COLORS[lvl.scene] || '#fff');
    if (gameMode === 'level'){
      chip(levelPercent() + '%  ·  VERSUCH ' + levelAttempts, 14, 14, 'left', '#ffffff');
      chip('LEVEL-MODUS', W-14, 14, 'right', '#ffffff', '#5ab0ff');
      const bw = 280, bh = 12, bx = W/2 - bw/2, by = 122;
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; rr(bx - 2, by - 2, bw + 4, bh + 4, 8); ctx.fill();
      const fw = bw * levelPercent() / 100;
      if (fw > 0){
        const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
        g.addColorStop(0, '#ffd23a'); g.addColorStop(1, '#ff7a1a');
        ctx.fillStyle = g; rr(bx, by, Math.max(fw, bh), bh, bh/2); ctx.fill();
      }
      txt(levelPercent() + '%', bx + bw + 12, by + 11, 13, '#ffffff', 'left');
    } else {
      const modeLabel = gameMode === 'ranked' ? 'RANKED' : (gameMode === 'normal' ? 'NORMAL' : 'HIGHSCORE');
      chip('BEST ' + highscore, 14, 14, 'left', '#ffe08a');
      chip(rank.name.toUpperCase() + '  ·  ' + modeLabel, W-14, 14, 'right', '#ffffff', rank.color);
      if (boostActive){
        txt('JETPACK AKTIV · VOLLGAS BIS ' + BOOST_TARGET_SCORE + '!', W/2, 144, 20, '#ffd27a', 'center', { stroke:'rgba(60,20,0,0.9)', strokeW:5 });
      } else if (boostGraceFrames > 0){
        txt('GLEICH GEHT ES NORMAL WEITER …', W/2, 140, 15, '#ffffff', 'center');
      }
    }
  }

  // ----- Screens -----
  function drawMenu(){
    const lvl = levels[0];
    drawScene(lvl);
    menuClouds();
    drawGround(lvl);
    const my = 292 + Math.sin(frame*0.05)*10;
    glow(230, my, 200, [255,200,90], 0.35);
    drawBird(230, my, Math.sin(frame*0.04)*0.12, 4.0, 0.3 + 0.2*Math.sin(frame*0.1), false, false);
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(230, 452, 70 - Math.sin(frame*0.05)*8, 9, 0, 0, TAU); ctx.fill();

    ctx.save();
    ctx.font = '900 70px ' + FONT; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    ctx.lineWidth = 11; ctx.strokeStyle = 'rgba(46,24,6,0.92)'; ctx.strokeText('FLAPPY BIER', W/2, 100);
    ctx.fillStyle = vgrad(46, 104, [[0,'#fff6c4'],[0.5,'#ffcb3d'],[1,'#ff8c1a']]);
    ctx.fillText('FLAPPY BIER', W/2, 100);
    ctx.restore();
    txt('FLIEG DURCH DIE WELTEN', W/2, 126, 14, 'rgba(255,255,255,0.9)', 'center');

    const bw = 380, bh = 50, gap = 12, startY = 150, bx = 540;
    menuButtons = [
      { rect:{x:bx,y:startY,w:bw,h:bh},             label:'RANKED MODUS',          accent:'#ffc83a', action:()=>startEndlessMode('ranked') },
      { rect:{x:bx,y:startY+(bh+gap),w:bw,h:bh},    label:'NORMAL MODUS',          accent:'#6bdc7a', action:()=>startEndlessMode('normal') },
      { rect:{x:bx,y:startY+(bh+gap)*2,w:bw,h:bh},  label:'HIGHSCORE MODUS',       accent:'#ff7aa8', action:()=>startEndlessMode('highscore') },
      { rect:{x:bx,y:startY+(bh+gap)*3,w:bw,h:bh},  label:'LEVEL-MODUS (PARCOURS)',accent:'#5ab0ff', action:()=>{ state='levelSelect'; } },
      { rect:{x:bx,y:startY+(bh+gap)*4,w:bw,h:bh},  label:'ADMIN-PANEL',           accent:'#9aa4c4', action:()=>{ state='admin'; } },
    ];
    for (const b of menuButtons) drawButton(b.rect, b.label, true, b.accent);
    const rank = rankFor(totalScore);
    chip('BEST ' + highscore + '  ·  RANG ' + rank.name.toUpperCase() + ' (' + totalScore + ')', bx + bw/2, 458, 'center', '#ffffff', rank.color);
  }

  function drawLevelSelect(){
    drawNightBG();
    txt('LEVEL-AUSWAHL', W/2, 54, 34, '#ffffff', 'center', { stroke:'rgba(10,15,35,0.9)', strokeW:6 });
    levelSelectBack = { x:20, y:20, w:130, h:40 };
    drawButton(levelSelectBack, '< ZURÜCK', true, '#9db4ff');
    levelSelectButtons = [];
    const diffs = { erde:'EINFACH', mond:'EINFACH+', neptun:'MITTEL', feuermond:'SCHWER', jungle:'EXTREM' };
    const rowY0 = 84, rowH = 82, cardH = 72, cardX = 40, cardW = 880, sw = 190;
    worldConfigs.forEach((world, wi) => {
      const y = rowY0 + wi*rowH;
      ctx.fillStyle = 'rgba(255,255,255,0.06)'; rr(cardX, y, cardW, cardH, 16); ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.13)'; ctx.stroke();
      ctx.save();
      rr(cardX, y, sw, cardH, 16); ctx.clip();
      ctx.fillStyle = vgrad(y, y + cardH, [[0, world.bgTop],[1, world.bgBot]]); ctx.fillRect(cardX, y, sw, cardH);
      ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(cardX, y, sw, cardH);
      ctx.restore();
      txt(world.name.toUpperCase(), cardX + 16, y + 32, 19, '#ffffff', 'left');
      txt((diffs[world.key] || '') + '  ·  LEVEL ' + world.range[0] + '–' + world.range[1], cardX + 16, y + 54, 11, 'rgba(255,255,255,0.88)', 'left', { shadow:false });
      let i = 0;
      for (let n = world.range[0]; n <= world.range[1]; n++, i++){
        const cx = cardX + sw + 34 + i*44, cy = y + 30, r = 16;
        const locked = n > levelProgress.unlocked, done = n < levelProgress.unlocked, cur = n === levelProgress.unlocked;
        const rect = { x:cx - r - 2, y:cy - r - 2, w:(r + 2)*2, h:(r + 2)*2 };
        const hov = !locked && hitRect(rect, hoverX, hoverY);
        if (hov) anyHover = true;
        const rad = r + (hov ? 2 : 0);
        if (cur) glow(cx, cy, 34, [255,190,60], 0.45 + 0.25*Math.sin(frame*0.1));
        const g = ctx.createLinearGradient(0, cy - rad, 0, cy + rad);
        if (locked){ g.addColorStop(0, '#363c58'); g.addColorStop(1, '#232840'); }
        else if (done){ g.addColorStop(0, '#5fd37a'); g.addColorStop(1, '#2f9a4c'); }
        else { g.addColorStop(0, '#ffd45a'); g.addColorStop(1, '#f08a1c'); }
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, rad, 0, TAU); ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = hov ? '#ffffff' : 'rgba(255,255,255,0.4)'; ctx.stroke();
        if (locked){
          ctx.fillStyle = 'rgba(255,255,255,0.5)'; rr(cx - 5, cy - 1, 10, 8, 2); ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.8;
          ctx.beginPath(); ctx.arc(cx, cy - 2, 3.6, Math.PI, 0); ctx.stroke();
        } else if (done){
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
          ctx.beginPath(); ctx.moveTo(cx - 6, cy + 0.5); ctx.lineTo(cx - 1.5, cy + 5); ctx.lineTo(cx + 6.5, cy - 5); ctx.stroke();
        } else {
          txt(String(n), cx, cy + 5, 14, '#3a2208', 'center', { shadow:false });
        }
        const best = levelProgress.best[n] || 0;
        if (!done && !locked && best > 0) txt(best + '%', cx, y + 62, 10, 'rgba(255,255,255,0.8)', 'center', { shadow:false });
        levelSelectButtons.push({ levelNum:n, rect, locked });
      }
    });
    txt('Schaffe ein Level, um das nächste freizuschalten', W/2, 520, 12, 'rgba(255,255,255,0.6)', 'center', { shadow:false });
  }

  let adminButtons = [];
  function drawAdmin(){
    drawNightBG();
    txt('ADMIN-PANEL', W/2, 54, 34, '#ffffff', 'center', { stroke:'rgba(10,15,35,0.9)', strokeW:6 });
    adminButtons = [];
    const back = { x:20, y:20, w:130, h:40 };
    drawButton(back, '< ZURÜCK', true, '#9db4ff');
    adminButtons.push({ rect:back, action:()=>{ state='menu'; } });
    panel(W/2 - 300, 84, 600, 360);
    txt('START-SCORE RANKED-MODUS', W/2, 126, 14, 'rgba(255,255,255,0.78)', 'center', { shadow:false });
    const minus = { x:W/2 - 180, y:142, w:70, h:50 }, plus = { x:W/2 + 110, y:142, w:70, h:50 };
    drawButton(minus, '-10', true, '#ff8a8a');
    drawButton(plus, '+10', true, '#6bdc7a');
    adminButtons.push({ rect:minus, action:()=>{ rankedStartScore = Math.max(0, rankedStartScore - 10); saveAdminStart(); } });
    adminButtons.push({ rect:plus, action:()=>{ rankedStartScore = Math.min(300, rankedStartScore + 10); saveAdminStart(); } });
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; rr(W/2 - 90, 142, 180, 50, 14); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.stroke();
    txt(String(rankedStartScore), W/2, 177, 30, '#ffd27a', 'center');
    txt('Ranked startet dann direkt mit ' + rankedStartScore + ' Punkten', W/2, 220, 12, 'rgba(255,255,255,0.6)', 'center', { shadow:false });
    const aw = 380, ah = 46, ag = 14, ay = 244, ax = W/2 - aw/2;
    const r1 = { x:ax, y:ay, w:aw, h:ah }, r2 = { x:ax, y:ay + ah + ag, w:aw, h:ah }, r3 = { x:ax, y:ay + (ah + ag)*2, w:aw, h:ah };
    drawButton(r1, 'ALLE LEVEL FREISCHALTEN', true, '#6bdc7a');
    drawButton(r2, 'LEVEL-FORTSCHRITT RESET', true, '#ffb627');
    drawButton(r3, 'RANG & HIGHSCORE RESET', true, '#ff6b6b');
    adminButtons.push({ rect:r1, action:()=>{ levelProgress.unlocked = TOTAL_LEVELS; saveLevelProgress(); } });
    adminButtons.push({ rect:r2, action:()=>{ levelProgress.unlocked = 1; levelProgress.best = {}; saveLevelProgress(); } });
    adminButtons.push({ rect:r3, action:()=>{ highscore = 0; totalScore = 0; saveHighscore(); saveTotal(); } });
  }

  function drawLevelComplete(){
    const lvl = getCurrentLvl();
    drawPlayfield(lvl, 0, 0);
    drawVignette();
    ctx.fillStyle = 'rgba(4,6,18,0.6)'; ctx.fillRect(0, 0, W, H);
    const px = W/2 - 250, py = 96, pw = 500, ph = 330;
    panel(px, py, pw, ph);
    txt('LEVEL ' + currentLevelNumber + ' GESCHAFFT!', W/2, py + 62, 36, '#8dff9b', 'center', { stroke:'rgba(8,40,18,0.9)', strokeW:6 });
    txt(worldForLevel(currentLevelNumber).name.toUpperCase(), W/2, py + 90, 15, 'rgba(255,255,255,0.85)', 'center');
    for (let i = 0; i < 3; i++){
      const sx = W/2 + (i - 1)*54, sy = py + 138 + (i === 1 ? -6 : 0);
      glow(sx, sy, 34, [255,200,60], 0.45);
      starPath(sx, sy, 22, 9); ctx.fillStyle = vgrad(sy - 22, sy + 22, [[0,'#fff1a0'],[1,'#ffb21c']]); ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#a8620a'; ctx.stroke();
    }
    const next = currentLevelNumber + 1, hasNext = next <= TOTAL_LEVELS;
    const bw = 300, bh = 48;
    levelCompleteButtons = [];
    if (hasNext){
      const r1 = { x:W/2 - bw/2, y:py + 186, w:bw, h:bh }, r2 = { x:W/2 - bw/2, y:py + 186 + bh + 14, w:bw, h:bh };
      drawButton(r1, 'NÄCHSTES LEVEL', true, '#6bdc7a');
      drawButton(r2, 'LEVEL-AUSWAHL', true, '#5ab0ff');
      levelCompleteButtons.push({ rect:r1, action:()=>startLevel(next) });
      levelCompleteButtons.push({ rect:r2, action:()=>{ state='levelSelect'; } });
    } else {
      txt('ALLE LEVEL GESCHAFFT!', W/2, py + 206, 18, '#ffd27a', 'center');
      const r2 = { x:W/2 - bw/2, y:py + 226, w:bw, h:bh };
      drawButton(r2, 'LEVEL-AUSWAHL', true, '#5ab0ff');
      levelCompleteButtons.push({ rect:r2, action:()=>{ state='levelSelect'; } });
    }
  }

  function drawGameOverScreen(){
    const lvl = getCurrentLvl();
    drawPlayfield(lvl, 1.2, 0);
    drawVignette();
    ctx.fillStyle = 'rgba(4,6,18,0.62)'; ctx.fillRect(0, 0, W, H);
    gameoverButtons = [];
    const cx = W/2;

    if (gameMode === 'level'){
      panel(cx - 250, 64, 500, 408);
      txt('NICHT GESCHAFFT', cx, 114, 34, '#ff8a8a', 'center', { stroke:'rgba(50,10,10,0.9)', strokeW:6 });
      txt(lvl.name.toUpperCase(), cx, 142, 14, 'rgba(255,255,255,0.85)', 'center');
      txt(levelPercent() + '%', cx, 214, 64, '#ffffff', 'center', { stroke:'rgba(12,18,40,0.9)', strokeW:8 });
      const bw = 340, bx = cx - bw/2;
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; rr(bx - 2, 228, bw + 4, 16, 9); ctx.fill();
      const fw = bw * levelPercent() / 100;
      if (fw > 0){
        const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
        g.addColorStop(0, '#ffd23a'); g.addColorStop(1, '#ff7a1a');
        ctx.fillStyle = g; rr(bx, 230, Math.max(fw, 12), 12, 6); ctx.fill();
      }
      const bestPct = levelProgress.best[currentLevelNumber] || 0;
      txt('BESTE: ' + bestPct + '%   ·   VERSUCH ' + levelAttempts, cx, 272, 15, '#ffe08a', 'center');
      const bw2 = 300, bh = 42;
      const r1 = { x:cx - bw2/2, y:292, w:bw2, h:bh }, r2 = { x:cx - bw2/2, y:292 + bh + 10, w:bw2, h:bh }, r3 = { x:cx - bw2/2, y:292 + (bh + 10)*2, w:bw2, h:bh };
      drawButton(r1, 'NOCHMAL VERSUCHEN', true, '#ffc83a');
      drawButton(r2, 'LEVEL-AUSWAHL', true, '#5ab0ff');
      drawButton(r3, 'HAUPTMENÜ', true, '#9aa4c4');
      gameoverButtons.push({ rect:r1, action:retryCurrentRun });
      gameoverButtons.push({ rect:r2, action:()=>{ state='levelSelect'; } });
      gameoverButtons.push({ rect:r3, action:()=>{ state='menu'; } });
      return;
    }

    const pulse = 0.65 + 0.35*Math.sin(frame*0.08);
    if (gameMode === 'ranked'){
      const rank = rankFor(totalScore), nxt = nextRankFor(totalScore);
      panel(cx - 250, 38, 500, 424);
      txt('GAME OVER', cx, 92, 38, '#ff8a8a', 'center', { stroke:'rgba(50,10,10,0.9)', strokeW:6 });
      txt('PUNKTE', cx, 122, 12, 'rgba(255,255,255,0.7)', 'center', { shadow:false });
      txt(String(score), cx, 176, 56, '#ffffff', 'center', { stroke:'rgba(12,18,40,0.9)', strokeW:8 });
      txt(lvl.name.toUpperCase() + '   ·   BEST ' + highscore, cx, 204, 14, '#ffe08a', 'center');
      txt(rank.name.toUpperCase(), cx, 246, 24, rank.color, 'center', { stroke:'rgba(10,12,30,0.85)', strokeW:5 });
      const bw = 380, bx = cx - bw/2, by = 258, bh = 16;
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; rr(bx - 2, by - 2, bw + 4, bh + 4, 10); ctx.fill();
      const prog = nxt ? Math.max(0, Math.min(1, (totalScore - rank.min) / (nxt.min - rank.min))) : 1;
      const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      g.addColorStop(0, rank.color); g.addColorStop(1, '#ffffff');
      ctx.fillStyle = g; rr(bx, by, Math.max(bw*prog, bh), bh, bh/2); ctx.fill();
      txt(String(rank.min), bx, by + 34, 11, 'rgba(255,255,255,0.65)', 'left', { shadow:false });
      if (nxt) txt(nxt.name.toUpperCase() + ' ' + nxt.min, bx + bw, by + 34, 11, 'rgba(255,255,255,0.65)', 'right', { shadow:false });
      txt('+' + lastRunAdded + ' PUNKTE  (GESAMT ' + totalScore + ')', cx, 318, 15, '#8dff9b', 'center');
      txt(nxt ? 'NOCH ' + (nxt.min - totalScore) + ' BIS ' + nxt.name.toUpperCase() : 'HÖCHSTER RANG ERREICHT', cx, 342, 15, '#ffffff', 'center');
      ctx.save(); ctx.globalAlpha = pulse; txt('TIPPEN ZUM NEUSTART', cx, 378, 15, '#ffd27a', 'center'); ctx.restore();
      const mr = { x:cx - 110, y:392, w:220, h:44 };
      drawButton(mr, 'HAUPTMENÜ', true, '#9aa4c4');
      gameoverButtons.push({ rect:mr, action:()=>{ state='menu'; } });
    } else {
      panel(cx - 250, 80, 500, 340);
      txt('GAME OVER', cx, 136, 38, '#ff8a8a', 'center', { stroke:'rgba(50,10,10,0.9)', strokeW:6 });
      txt('PUNKTE', cx, 168, 12, 'rgba(255,255,255,0.7)', 'center', { shadow:false });
      txt(String(score), cx, 226, 56, '#ffffff', 'center', { stroke:'rgba(12,18,40,0.9)', strokeW:8 });
      txt(lvl.name.toUpperCase() + '   ·   BEST ' + highscore, cx, 258, 14, '#ffe08a', 'center');
      ctx.save(); ctx.globalAlpha = pulse; txt('TIPPEN ZUM NEUSTART', cx, 306, 15, '#ffd27a', 'center'); ctx.restore();
      const mr = { x:cx - 110, y:326, w:220, h:44 };
      drawButton(mr, 'HAUPTMENÜ', true, '#9aa4c4');
      gameoverButtons.push({ rect:mr, action:()=>{ state='menu'; } });
    }
  }

  function drawTunnelOverlay(){
    const cx = bird.x, cy = bird.y, maxR = Math.hypot(W, H);
    let radius;
    if (transitionPhase === 0) radius = maxR * (1 - Math.min(transitionT/0.7, 1));
    else if (transitionPhase === 1) radius = 0;
    else radius = maxR * Math.min(transitionT/0.7, 1);
    if (radius < 2){
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    } else {
      const g = ctx.createRadialGradient(cx, cy, radius*0.82, cx, cy, radius);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,1)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineWidth = 3;
      for (let i = 0; i < 3; i++){
        ctx.strokeStyle = 'rgba(255,190,80,' + (0.28 - i*0.08).toFixed(2) + ')';
        ctx.beginPath(); ctx.arc(cx, cy, radius*(0.84 + i*0.07), 0, TAU); ctx.stroke();
      }
      ctx.restore();
    }
    if (transitionPhase === 1 || (transitionPhase === 0 && transitionT > 0.4) || (transitionPhase === 2 && transitionT < 0.3)){
      const num = (transitionPhase === 0 ? currentLevel + 1 : currentLevel) + 1;
      const nm = transitionPhase === 0 ? levels[currentLevel + 1].name : levels[currentLevel].name;
      glow(W/2, H/2, 260, [255,190,80], 0.25);
      txt('LEVEL ' + num, W/2, H/2 - 8, 54, '#fff2cf', 'center', { stroke:'rgba(40,20,0,0.85)', strokeW:8 });
      txt(nm.toUpperCase(), W/2, H/2 + 34, 22, '#ffc85a', 'center');
    }
  }

  function draw(){
    ctx.setTransform(RS, 0, 0, RS, 0, 0);
    anyHover = false;
    if (state === 'menu') drawMenu();
    else if (state === 'levelSelect') drawLevelSelect();
    else if (state === 'admin') drawAdmin();
    else if (state === 'levelComplete') drawLevelComplete();
    else if (state === 'gameover') drawGameOverScreen();
    else {
      const lvl = getCurrentLvl();
      drawPlayfield(lvl, bird.rot, Math.max(0, bird.flapGlow));
      drawVignette();
      drawHUD(lvl);
      if (state === 'transition'){
        drawTunnelOverlay();
      }
    }
    canvas.style.cursor = anyHover ? 'pointer' : 'default';
  }

  // Feste 60-Hz-Spiellogik (auch auf 120/144-Hz-Monitoren gleich schnell) + automatische Qualitaetsanpassung
  let lastT = 0, acc = 0, slowCount = 0;
  function loop(t){
    t = t || performance.now();
    if (!lastT) lastT = t;
    const dt = Math.min(100, t - lastT);
    lastT = t;
    if (dt > 26) slowCount++; else slowCount = Math.max(0, slowCount - 1);
    if (slowCount > 45 && RS > 1){ RS = RS > 1.5 ? 1.5 : 1; setRes(); slowCount = 0; }
    acc += dt;
    const step = 1000 / 60;
    let n = 0;
    while (acc >= step && n < 4){ update(); acc -= step; n++; }
    if (n === 4) acc = 0;
    draw();
    requestAnimationFrame(loop);
  }

  setRes();
  resetGame();
  requestAnimationFrame(loop);
})();
</script>
